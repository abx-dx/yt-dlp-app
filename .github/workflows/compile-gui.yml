name: yt-dlp-gui Compile

on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout yt-dlp-gui
        uses: actions/checkout@v4
        with:
          repository: abx-dx/yt-dlp-app
          ref: yt-dlp-gui
          path: projects/yt-dlp-gui

      - name: Checkout yt-dlp-core
        uses: actions/checkout@v4
        with:
          repository: abx-dx/yt-dlp-app
          ref: yt-dlp-core
          path: projects/yt-dlp-core

      - name: Checkout yt-dlp-build-infra
        uses: actions/checkout@v4
        with:
          repository: abx-dx/yt-dlp-app
          ref: build-infra
          path: projects/yt-dlp-build-infra

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Compile frozen package
        shell: bash
        working-directory: projects/yt-dlp-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./compile.sh

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-compiled
          path: projects/yt-dlp-gui/dist/
          if-no-files-found: error